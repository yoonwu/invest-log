<article class="post" style="margin-bottom:14px">
  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
    <h1 style="font-size:18px;margin:0 0 2px">{{ include.post.title }}</h1>
    <a class="post-link" href="{{ include.post.url | relative_url }}">링크 ↗</a>
  </div>
  <div class="post-date">{{ include.post.date | date: "%Y년 %-m월 %-d일" }}</div>
  <div class="post-body">{{ include.post.content }}</div>
</article>
