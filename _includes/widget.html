<div id="acct" {% if include.no_summary %}data-no-summary{% endif %}>불러오는 중…</div>
<script>
(function () {
  const comma = n => Math.round(n).toLocaleString("ko-KR");
  const won = n => comma(n) + "원";
  const eok = n => n >= 1e8 ? (n / 1e8).toFixed(2) + "억" : comma(n / 1e4) + "만";
  const cls = n => n > 0 ? "up" : n < 0 ? "down" : "flat";
  const pct = n => (n > 0 ? "+" : "") + n.toFixed(2) + "%";
  const sw = n => (n > 0 ? "+" : n < 0 ? "-" : "") + comma(Math.abs(n)) + "원";
  const DISPLAY_NAME = { USD_CASH: "미국달러" };

  fetch("{{ '/data/valuation.json' | relative_url }}", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(d => {
      const acctHtml = d.accounts.map(a => `
        <div class="acard">
          <div class="acard-head">
            <span class="aname">${a.name}</span>
            <span class="pill ${cls(a.plKrw)}">${sw(a.plKrw)} · ${pct(a.plPct)}</span>
          </div>
          <div class="atotal">${won(a.totalKrw)}</div>
          <div class="asub">매입 ${won(a.costKrw)}</div>
          <div class="hlist">${a.holdings.map(h => `
            <div class="hrow">
              <div>
                <div class="hn">${h.name || DISPLAY_NAME[h.ticker] || h.ticker}</div>
                <div class="hs">${comma(h.qty)}${h.ticker === "USD_CASH" ? "달러" : "주"}${h.costKrw != null && h.ticker !== "USD_CASH" ? ` · 매입 ${eok(h.costKrw)}` : ""}</div>
              </div>
              <div class="hr">
                <div class="hv">${won(h.valueKrw)}</div>
                <div class="hs ${cls(h.plKrw ?? 0)}">${h.plKrw != null ? `${sw(h.plKrw)} (${pct(h.plPct)})` : ""}</div>
              </div>
            </div>`).join("")}
          </div>
        </div>`).join("");

      const at = new Date(d.generatedAt).toLocaleString("ko-KR",
        { timeZone: "Asia/Seoul", dateStyle: "medium", timeStyle: "short" });
      const box = document.getElementById("acct");
      const summary = box.dataset.noSummary !== undefined ? "" : `
        <div class="acard">
          <div class="acard-head">
            <span class="aname">전체 평가액</span>
            <span class="pill ${cls(d.plKrw)}">${sw(d.plKrw)} · ${pct(d.plPct)}</span>
          </div>
          <div class="atotal">${won(d.totalKrw)}</div>
          <div class="asub">매입 ${won(d.costKrw)}</div>
        </div>`;
      box.innerHTML = `
        ${summary}
        ${acctHtml}
        <div class="meta">기준 ${at} · USD/KRW ${d.usdkrw.price.toFixed(2)}<br>
          일 1회 자동 스냅샷 · 해외종목 매입금액은 당일 환율 환산 (환차손익 미포함)</div>`;
    })
    .catch(e => { document.getElementById("acct").textContent = "데이터를 불러올 수 없음 (" + e.message + ")"; });
})();
</script>
