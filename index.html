---
layout: default
---
<h1>계좌별 종합잔고</h1>
{% include widget.html %}

<section class="posts">
  <h2>일기</h2>
  <ul>
    {% for post in site.posts %}
    <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        <span class="date">{{ post.date | date: "%Y.%m.%d" }}</span></li>
    {% endfor %}
  </ul>
</section>
