# 평가액 계산 실행 (지금은 수동 트리거로 검증용 — 크론/커밋은 다음 단계에서 추가)
name: valuation

on:
  workflow_dispatch:
  push:  # 검증 단계 임시 트리거 — 크론 붙일 때 제거 예정
    paths:
      - "scripts/**"
      - "positions.json"
      - ".github/workflows/valuation.yml"

jobs:
  valuation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/fetch-valuation.mjs
