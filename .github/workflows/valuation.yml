# 매일 07:00 KST(22:00 UTC): 평가액 스냅샷 → Sonnet 브리핑 → (매월 1일) 결산 초안 → 커밋
name: valuation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: write

jobs:
  valuation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/fetch-valuation.mjs
      - name: Sonnet 브리핑 (키 없으면 생략)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install @anthropic-ai/sdk --no-audit --no-fund --no-save --loglevel=error
          node scripts/briefing.mjs
        continue-on-error: true
      - name: 공유용 카드 이미지 (data/card.png)
        run: |
          sudo apt-get install -y fonts-noto-cjk >/dev/null 2>&1 || true
          npm install playwright --no-audit --no-fund --no-save --loglevel=error
          npx playwright install --with-deps chromium
          node scripts/card.mjs
        continue-on-error: true
      - run: node scripts/monthly-draft.mjs
      - name: 스냅샷 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if [ -d drafts ]; then git add drafts/; fi
          git diff --cached --quiet || { git commit -m "chore: 일지 스냅샷 $(TZ=Asia/Seoul date +%F)"; git push; }
