# 매일 07:00 KST(22:00 UTC)에 평가액 스냅샷을 계산해 data/valuation.json 으로 커밋
name: valuation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: write

jobs:
  valuation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/fetch-valuation.mjs
      - name: 스냅샷 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/valuation.json
          git diff --cached --quiet || { git commit -m "chore: 평가액 스냅샷 $(TZ=Asia/Seoul date +%F)"; git push; }
