# 1회용 승격 워크플로 — 계좌일지 새 형식(날짜별 개별 페이지)을 라이브에 반영.
# 오늘(7/7 KST)은 손대지 않고, 7/7 KST가 끝난 뒤(UTC 15:00 이후) ~ 매일 자동실행(22:00 UTC) 전에
# feature 브랜치(claude/blog-content-missing-eez0n0)를 default 브랜치로 병합해 배포되게 한다.
# 병합 성공 시 자기 자신(이 파일)을 함께 제거해 1회만 동작한다. workflow_dispatch로 수동 실행도 가능.
name: promote-journal-format

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 7 7 *"   # 18:17 UTC 7/7 = 03:17 KST 7/8 (1차)
    - cron: "17 20 7 7 *"   # 20:17 UTC 7/7 = 05:17 KST 7/8 (예비, 1차 스킵 대비)

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/portfolio-valuation-script-0vbymm
          fetch-depth: 0
      - name: feature 브랜치 병합 → 배포 → self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin claude/blog-content-missing-eez0n0
          if git merge-base --is-ancestor origin/claude/blog-content-missing-eez0n0 HEAD; then
            echo "이미 반영됨 — 생략"; exit 0
          fi
          git merge --no-edit origin/claude/blog-content-missing-eez0n0
          git rm .github/workflows/promote.yml
          git commit -m "chore: 계좌일지 새 형식 라이브 반영 + 승격 워크플로 제거"
          git push origin HEAD:claude/portfolio-valuation-script-0vbymm
