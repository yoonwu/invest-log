# 임시 1회용: SOXL 과거 시세를 history.json에 백필하고 커밋. 확인 후 제거 예정.
name: backfill-soxl
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/backfill-soxl.mjs
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || { git commit -m "chore: SOXL 과거 시세 백필 (자산 추이 비교선)"; git push; }
