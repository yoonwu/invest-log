<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<style>
  /* 미래에셋 m.Stock 잔고 화면 모사 + 블로그 공통 */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f5f6f8; color: #1a1d21;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  .wrap { max-width: 440px; margin: 0 auto; padding: 20px 14px 40px; }
  h1 { font-size: 22px; font-weight: 800; margin: 4px 2px 16px; }

  .summary { background: #fff; border-radius: 12px; padding: 16px 18px; margin-bottom: 22px; }
  .summary .label { font-size: 13px; color: #6b7280; }
  .summary .amount { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px; }
  .summary .pl { font-size: 14px; font-weight: 600; margin-top: 4px; }

  .acct { margin-bottom: 26px; }
  .acct-name { font-size: 15px; font-weight: 600; padding: 10px 4px; color: #333; }

  .card {
    background: #3f4a5a; color: #fff; border-radius: 10px;
    padding: 18px 20px; display: flex; justify-content: space-between; align-items: flex-start;
  }
  .card .label { font-size: 14px; color: #cfd6e0; padding-top: 6px; }
  .card .right { text-align: right; }
  .card .amount { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
  .card .pl { font-size: 13px; font-weight: 600; margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 0 0 10px 10px; }
  thead th {
    font-size: 12px; font-weight: 500; color: #8a919c; background: #fafbfc;
    padding: 8px 10px; border-bottom: 1px solid #eceef1; line-height: 1.5;
  }
  thead th:first-child { text-align: left; }
  thead th:not(:first-child) { text-align: right; }
  tbody td { padding: 12px 10px; border-bottom: 1px solid #f0f2f4; font-size: 14px; vertical-align: top; line-height: 1.55; }
  tbody td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
  .tname { font-weight: 600; font-size: 13.5px; }
  .sub { color: #6b7280; font-size: 13px; }
  .up { color: #ef3e42; }
  .down { color: #3b6ce4; }
  .flat { color: #1a1d21; }

  .meta { margin-top: 18px; font-size: 12px; color: #8a919c; line-height: 1.7; text-align: center; }

  /* 글 목록 */
  .posts { margin-top: 30px; }
  .posts h2 { font-size: 17px; font-weight: 700; margin: 0 2px 10px; }
  .posts ul { list-style: none; margin: 0; padding: 0; background: #fff; border-radius: 12px; }
  .posts li { display: flex; justify-content: space-between; align-items: baseline;
              padding: 14px 16px; border-bottom: 1px solid #f0f2f4; }
  .posts li:last-child { border-bottom: none; }
  .posts a { color: #1a1d21; text-decoration: none; font-weight: 600; font-size: 15px; }
  .posts .date { color: #8a919c; font-size: 12.5px; white-space: nowrap; margin-left: 12px; }

  /* 글 본문 */
  .post { background: #fff; border-radius: 12px; padding: 20px 18px; }
  .post .back { display: inline-block; font-size: 13px; color: #6b7280; text-decoration: none; margin-bottom: 14px; }
  .post h1 { margin: 0 0 4px; }
  .post .post-date { color: #8a919c; font-size: 13px; margin-bottom: 18px; }
  .post-body { font-size: 15px; line-height: 1.8; }
  .post-body h2 { font-size: 17px; margin: 26px 0 8px; }
  .post-body img { max-width: 100%; border-radius: 8px; }
  .post-body table { border-radius: 8px; overflow: hidden; border: 1px solid #eceef1; }
  .post-body th, .post-body td { padding: 8px 10px; font-size: 14px; border-bottom: 1px solid #f0f2f4; }
  .post-body th { background: #fafbfc; color: #6b7280; font-weight: 500; text-align: left; }
  .post-body blockquote { margin: 0; padding: 2px 14px; border-left: 3px solid #d7dbe0; color: #6b7280; }

  /* 홈 요약 + 차트 */
  .home-summary { background: #3f4a5a; color: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
  .home-summary .top { display: flex; justify-content: space-between; align-items: baseline; }
  .home-summary .label { font-size: 13px; color: #cfd6e0; }
  .home-summary .dplus { font-size: 12px; color: #aeb7c4; }
  .home-summary .amount { font-size: 27px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px; }
  .home-summary .pl { font-size: 13.5px; font-weight: 600; margin-top: 4px; }
  .home-summary .pl .up { color: #ff8a8d; }
  .home-summary .pl .down { color: #8fb3ff; }
  .home-summary .sub2 { font-size: 12px; color: #aeb7c4; margin-top: 6px; }
  .chart-card { background: #fff; border-radius: 12px; padding: 14px 12px 8px; margin-bottom: 22px; }
  .chart-card h2 { font-size: 14px; font-weight: 700; margin: 0 6px 4px; }
  .chart-legend { display: flex; gap: 14px; font-size: 12px; color: #52514e; margin: 2px 6px 6px; }
  .chart-legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .chart-empty { color: #8a919c; font-size: 13px; text-align: center; padding: 26px 0 32px; }
  .chart-tip { position: absolute; pointer-events: none; background: #1a1d21; color: #fff;
               font-size: 11.5px; line-height: 1.55; padding: 6px 9px; border-radius: 7px;
               white-space: nowrap; display: none; z-index: 5; }

  /* 일지 피드 */
  .feed h2 { font-size: 17px; font-weight: 700; margin: 26px 2px 10px; }
  .entry { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .entry-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .entry-date { font-weight: 700; font-size: 15px; }
  .entry-date .dplus { font-weight: 500; font-size: 12px; color: #8a919c; margin-left: 6px; }
  .copy-btn { font-size: 12px; color: #52616e; background: #eef1f4; border: none;
              border-radius: 7px; padding: 5px 10px; cursor: pointer; font-family: inherit; }
  .row2 { display: flex; gap: 8px; font-size: 13.5px; line-height: 1.75; }
  .row2 .tag { flex: none; width: 52px; color: #8a919c; font-size: 12px; padding-top: 2px; }
  .row2 .body { flex: 1; min-width: 0; }
  .row2 .body .sub { color: #6b7280; font-size: 12.5px; }
  .row2 + .row2 { margin-top: 6px; border-top: 1px solid #f0f2f4; padding-top: 6px; }
  .brief { color: #333; }
  .memo { background: #fbf7ec; border-radius: 8px; padding: 8px 10px; }
  .more-btn { display: block; width: 100%; background: #fff; border: none; border-radius: 12px;
              padding: 12px; font-size: 13.5px; color: #52616e; cursor: pointer; font-family: inherit; }
  .acct-link { display: block; text-align: center; background: #fff; border-radius: 12px;
               padding: 13px; font-size: 14px; font-weight: 600; color: #1a1d21;
               text-decoration: none; margin-bottom: 4px; }

  /* 일지 카드 v2 — 훑어보기용 */
  .entry-total { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .entry-total .tot { font-size: 19px; font-weight: 800; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; }
  .pill { flex: none; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 10px; font-variant-numeric: tabular-nums; }
  .pill.up { background: #fdeaea; color: #dd2b30; }
  .pill.down { background: #e8effc; color: #2f5fd0; }
  .pill.flat { background: #f0f2f4; color: #52514e; }
  .entry-accts { margin-top: 7px; font-size: 12.5px; color: #6b7280; line-height: 1.65; }
  .sec-label { font-size: 11.5px; color: #99a0aa; margin: 14px 0 7px; font-weight: 700; letter-spacing: 0.04em; }
  .mgrid { display: grid; grid-template-columns: auto 1fr auto 1fr; column-gap: 14px; row-gap: 7px;
           font-size: 13.5px; align-items: baseline; }
  .mgrid span { color: #6b7280; font-size: 12.5px; }
  .mgrid b { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: #f4f6f8; border-radius: 8px; padding: 4px 9px; font-size: 12.5px; color: #52514e; white-space: nowrap; }
  .chip b { font-weight: 700; font-variant-numeric: tabular-nums; }
  .trade-box { background: #fff5e0; border-radius: 8px; padding: 9px 11px; font-size: 13.5px; font-weight: 700; }
  .brief-p { font-size: 13.5px; line-height: 1.75; color: #333; margin: 0; }
  details.pin { margin-top: 14px; }
  details.pin summary { cursor: pointer; font-size: 12px; color: #8a919c; font-weight: 700;
                        list-style: none; padding: 8px 0 2px; border-top: 1px solid #f0f2f4; }
  details.pin summary::before { content: "▸ "; }
  details.pin[open] summary::before { content: "▾ "; }
  .pin-table { width: 100%; border-collapse: collapse; margin-top: 4px; background: transparent; }
  .pin-table td { padding: 4px 0; border-bottom: none; font-size: 12.5px; color: #52514e; }
  .pin-table td:last-child, .pin-table td:nth-child(3) { text-align: right; font-variant-numeric: tabular-nums; }
  .pin-table .grp td { padding-top: 8px; font-weight: 700; color: #1a1d21; text-align: left; }
  .pin-table td.up { color: #ef3e42; }
  .pin-table td.down { color: #3b6ce4; }
</style>
</head>
<body>
<div class="wrap">
{{ content }}
</div>
</body>
</html>
