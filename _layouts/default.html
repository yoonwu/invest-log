<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<style>
  /* 미래에셋 m.Stock 잔고 화면 모사 + 블로그 공통 */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f5f6f8; color: #1a1d21;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  .wrap { max-width: 440px; margin: 0 auto; padding: 20px 14px 40px; }
  h1 { font-size: 22px; font-weight: 800; margin: 4px 2px 16px; }

  .summary { background: #fff; border-radius: 12px; padding: 16px 18px; margin-bottom: 22px; }
  .summary .label { font-size: 13px; color: #6b7280; }
  .summary .amount { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px; }
  .summary .pl { font-size: 14px; font-weight: 600; margin-top: 4px; }

  .acct { margin-bottom: 26px; }
  .acct-name { font-size: 15px; font-weight: 600; padding: 10px 4px; color: #333; }

  .card {
    background: #3f4a5a; color: #fff; border-radius: 10px;
    padding: 18px 20px; display: flex; justify-content: space-between; align-items: flex-start;
  }
  .card .label { font-size: 14px; color: #cfd6e0; padding-top: 6px; }
  .card .right { text-align: right; }
  .card .amount { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
  .card .pl { font-size: 13px; font-weight: 600; margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 0 0 10px 10px; }
  thead th {
    font-size: 12px; font-weight: 500; color: #8a919c; background: #fafbfc;
    padding: 8px 10px; border-bottom: 1px solid #eceef1; line-height: 1.5;
  }
  thead th:first-child { text-align: left; }
  thead th:not(:first-child) { text-align: right; }
  tbody td { padding: 12px 10px; border-bottom: 1px solid #f0f2f4; font-size: 14px; vertical-align: top; line-height: 1.55; }
  tbody td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
  .tname { font-weight: 600; font-size: 13.5px; }
  .sub { color: #6b7280; font-size: 13px; }
  .up { color: #ef3e42; }
  .down { color: #3b6ce4; }
  .flat { color: #1a1d21; }

  .meta { margin-top: 18px; font-size: 12px; color: #8a919c; line-height: 1.7; text-align: center; }

  /* 글 목록 */
  .posts { margin-top: 30px; }
  .posts h2 { font-size: 17px; font-weight: 700; margin: 0 2px 10px; }
  .posts ul { list-style: none; margin: 0; padding: 0; background: #fff; border-radius: 12px; }
  .posts li { display: flex; justify-content: space-between; align-items: baseline;
              padding: 14px 16px; border-bottom: 1px solid #f0f2f4; }
  .posts li:last-child { border-bottom: none; }
  .posts a { color: #1a1d21; text-decoration: none; font-weight: 600; font-size: 15px; }
  .posts .date { color: #8a919c; font-size: 12.5px; white-space: nowrap; margin-left: 12px; }

  /* 글 본문 */
  .post { background: #fff; border-radius: 12px; padding: 20px 18px; }
  .post .back { display: inline-block; font-size: 13px; color: #6b7280; text-decoration: none; margin-bottom: 14px; }
  .post h1 { margin: 0 0 4px; }
  .post .post-date { color: #8a919c; font-size: 13px; margin-bottom: 18px; }
  .post-body { font-size: 15px; line-height: 1.8; }
  .post-body h2 { font-size: 17px; margin: 26px 0 8px; }
  .post-body img { max-width: 100%; border-radius: 8px; }
  .post-body table { border-radius: 8px; overflow: hidden; border: 1px solid #eceef1; }
  .post-body th, .post-body td { padding: 8px 10px; font-size: 14px; border-bottom: 1px solid #f0f2f4; }
  .post-body th { background: #fafbfc; color: #6b7280; font-weight: 500; text-align: left; }
  .post-body blockquote { margin: 0; padding: 2px 14px; border-left: 3px solid #d7dbe0; color: #6b7280; }
</style>
</head>
<body>
<div class="wrap">
{{ content }}
</div>
</body>
</html>
