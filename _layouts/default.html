<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<style>
  /* 라이트 + 연그레이 포인트. 색이 아니라 여백·경계선·톤 차이로 엣지를 줌 */
  :root {
    --bg: #f4f5f3;
    --card: #ffffff;
    --card2: #fafaf8;
    --border: #e7e8e3;
    --text: #16181c;
    --sub: #6b7280;
    --sub2: #98a1ad;
    --accent: #4b5563;
    --accent-soft: rgba(75, 85, 99, .07);
    --up: #d6303f;   /* 상승 — 국내 증시 관례대로 빨강 */
    --down: #2b5fd9; /* 하락 — 파랑 */
    --up-bg: rgba(214, 48, 63, .10);
    --down-bg: rgba(43, 95, 217, .10);
    --mono: "SF Mono", "Roboto Mono", ui-monospace, Menlo, monospace;
    --prose: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  a { color: inherit; }
  .wrap { max-width: 440px; margin: 0 auto; padding: 20px 14px 40px; }
  h1 { font-size: 22px; font-weight: 800; margin: 4px 2px 16px; }
  .back { display: inline-block; font-size: 13px; color: var(--sub); text-decoration: none; margin-bottom: 10px; }
  .post-link { flex: none; font-size: 12px; color: var(--sub2); text-decoration: none; }

  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--sub); }

  .pill { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; border-radius: 999px;
          padding: 4px 10px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .pill.up { background: var(--up-bg); color: var(--up); }
  .pill.down { background: var(--down-bg); color: var(--down); }
  .pill.flat { background: var(--card2); color: var(--sub); }

  .meta { margin-top: 18px; font-size: 12px; color: var(--sub2); line-height: 1.7; text-align: center; }

  /* 계좌 카드 (요약·계좌별 잔고·일지 히어로 공통 컴포넌트) */
  .acard { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 16px 6px; margin-bottom: 12px; }
  .acard-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .acard-head .aname { font-size: 13px; font-weight: 700; color: var(--sub); }
  .acard .atotal { font-size: 20px; font-weight: 800; margin-top: 6px; letter-spacing: -0.3px;
                   font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .acard .asub { font-size: 12px; color: var(--sub2); margin: 3px 0 12px; }
  .acard .dsub { font-size: 11px; color: var(--sub2); }

  /* 히어로(전체 평가액) 카드 — 화이트 유지, 숫자에만 골드 포인트로 강조 */
  .acard.hero { padding-bottom: 16px; margin-bottom: 14px; position: relative; overflow: hidden; }
  .acard.hero::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); }
  .acard.hero .atotal { font-size: 28px; color: var(--accent); }

  .hrow { display: flex; justify-content: space-between; align-items: center; gap: 10px;
          padding: 11px 0; border-top: 1px solid var(--border); }
  .hrow .hn { font-size: 14px; font-weight: 600; }
  .hrow .hs { font-size: 12px; color: var(--sub2); margin-top: 2px; }
  .hrow .hr { text-align: right; flex: none; }
  .hrow .hv { font-size: 14px; font-weight: 650; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .hrow .hs.up { color: var(--up); }
  .hrow .hs.down { color: var(--down); }

  /* 글 목록 */
  .posts { margin-top: 30px; }
  .posts h2 { font-size: 17px; font-weight: 700; margin: 0 2px 10px; }
  .posts h2::before, .feed h2::before {
    content: ""; display: inline-block; width: 8px; height: 8px; background: var(--accent);
    margin-right: 8px; vertical-align: 1px;
  }

  /* 글 본문 — 데이터 카드와 분리된 프로즈 전용 타이포 */
  .post { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 22px 20px; margin-bottom: 14px; }
  .post .back { display: inline-block; font-size: 13px; color: var(--sub); text-decoration: none; margin-bottom: 14px; }
  .post h1 { margin: 0 0 8px; font-family: var(--prose); font-size: 21px; line-height: 1.4; letter-spacing: -0.2px; }
  .post .post-date { color: var(--sub2); font-size: 12.5px; margin-bottom: 20px; }
  .post-body { font-size: 16px; line-height: 1.9; font-family: var(--prose); color: #262b33; word-break: keep-all; }
  .post-body p { margin: 0 0 18px; }
  .post-body h2 { font-size: 16px; font-weight: 700; margin: 28px 0 10px; color: var(--text);
                  border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .post-body ul, .post-body ol { padding-left: 22px; margin: 0 0 18px; }
  .post-body li { margin-bottom: 6px; }
  .post-body img { max-width: 100%; border-radius: 8px; }
  .post-body table { width: 100%; border-collapse: collapse; margin: 4px 0 18px; font-size: 14px; }
  .post-body th, .post-body td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  .post-body th { color: var(--sub); font-weight: 600; font-size: 12.5px; }
  .post-body td:last-child, .post-body th:last-child { text-align: right; font-family: var(--mono); }
  /* 한글엔 진짜 이탤릭이 없어 브라우저가 억지로 기울이면 자모가 깨진다 — 색+선으로만 구분 */
  .post-body blockquote { margin: 0 0 18px; padding: 4px 0 4px 16px; border-left: 2px solid var(--accent);
                           color: var(--sub); font-size: 14.5px; line-height: 1.8; }
  .post-body strong { color: var(--text); font-weight: 700; }

  /* 자산 추이 차트 카드 */
  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 14px 10px;
                margin-bottom: 12px; position: relative; }
  .chart-card h2 { font-size: 13.5px; font-weight: 700; margin: 0 4px 4px; }
  .chart-legend { display: flex; gap: 12px; font-size: 11px; color: var(--sub); margin: 0 4px 8px; }
  .chart-legend .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 1px; }
  .chart-empty { color: var(--sub2); font-size: 13px; text-align: center; padding: 26px 0 32px; }
  .chart-tip { position: absolute; pointer-events: none; background: var(--card2); border: 1px solid var(--border);
               color: var(--text); font-size: 11.5px; line-height: 1.55; padding: 6px 9px; border-radius: 7px;
               white-space: nowrap; display: none; z-index: 5; font-family: var(--mono); }

  /* 일지 피드 */
  .feed h2 { font-size: 17px; font-weight: 700; margin: 26px 2px 10px; }
  .entry { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 15px 16px; margin-bottom: 10px; }
  .entry-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .entry-date { font-weight: 700; font-size: 14px; }
  .entry-date .dplus { font-weight: 500; font-size: 11px; color: var(--sub2); margin-left: 5px; }
  .copy-btn { font-size: 11px; color: var(--sub); background: var(--card2); border: 1px solid var(--border);
              border-radius: 7px; padding: 4px 9px; cursor: pointer; font-family: inherit; }
  .entry-total { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .entry-total .tot { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .entry-accts { margin-top: 7px; font-size: 12px; color: var(--sub); line-height: 1.65; }
  .sec-label { font-size: 11px; color: var(--sub2); margin: 13px 0 6px; font-weight: 700; letter-spacing: 0.04em; }
  .mgrid { display: grid; grid-template-columns: auto 1fr auto 1fr; column-gap: 12px; row-gap: 6px;
           font-size: 12.5px; align-items: baseline; }
  .mgrid span { color: var(--sub); font-size: 11.5px; }
  .mgrid b { text-align: right; font-weight: 650; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 4px 9px;
          font-size: 12px; color: var(--sub); white-space: nowrap; }
  .chip b { font-weight: 700; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .trade-box { background: var(--accent-soft); border: 1px solid rgba(75, 85, 99, .25); border-radius: 8px;
               padding: 9px 11px; font-size: 13.5px; font-weight: 700; color: var(--accent); }
  .brief-p { font-size: 13.5px; line-height: 1.75; color: var(--text); margin: 0; font-family: var(--prose); }
  .memo { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .more-btn { display: block; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
              padding: 12px; font-size: 13.5px; color: var(--sub); cursor: pointer; font-family: inherit; }

  /* 지난 일지 목록 (월별 그룹 링크) */
  .journal-list { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 6px 16px; }
  .journal-month { font-size: 11px; color: var(--sub2); font-weight: 700; letter-spacing: 0.04em;
                   margin: 12px 0 4px; }
  .journal-link { display: block; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13.5px;
                  color: var(--text); text-decoration: none; }
  .journal-month + .journal-link, .journal-list > .journal-link:first-child { border-top: none; }
  .journal-pager { display: flex; justify-content: space-between; margin: 14px 2px 0; font-size: 13px; }
  .journal-pager a { color: var(--sub); text-decoration: none; }

  details.pin { margin-top: 14px; }
  details.pin summary { cursor: pointer; font-size: 12px; color: var(--sub2); font-weight: 700;
                        list-style: none; padding: 8px 0 2px; border-top: 1px solid var(--border); }
  details.pin summary::-webkit-details-marker { display: none; }
  details.pin summary::before { content: "▸ "; }
  details.pin[open] summary::before { content: "▾ "; }
  .pin-table { width: 100%; border-collapse: collapse; margin-top: 4px; background: transparent; }
  .pin-table td { padding: 4px 0; border-bottom: none; font-size: 12.5px; color: var(--sub); }
  .pin-table td:last-child, .pin-table td:nth-child(3) { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .pin-table .grp td { padding-top: 8px; font-weight: 700; color: var(--text); text-align: left; }
  .pin-table td.up { color: var(--up); }
  .pin-table td.down { color: var(--down); }
</style>
</head>
<body>
<div class="wrap">
{{ content }}
</div>
</body>
</html>
